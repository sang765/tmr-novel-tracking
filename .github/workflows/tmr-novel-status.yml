name: Update Novel Status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-updates:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        token: ${{ secrets.PAT }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run display status
      env:
        STATUS_WEBHOOK_URL: ${{ secrets.STATUS_WEBHOOK_URL }}
      run: python ./scripts/display_status.py

    - name: Commit and push changes
      env:
        GIT_TOKEN: ${{ secrets.PAT }}
      run: |
        git config --local user.email "bemimnitran@gmail.com"
        git config --local user.name "Hà Tiến Sáng"
        git add novel_status.md
        if [ -f message_id.txt ]; then git add message_id.txt; fi
        git commit -m "Update novel tracking data" || echo "No changes to commit"
        git push
