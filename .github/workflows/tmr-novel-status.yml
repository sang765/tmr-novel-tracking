name: Update Novel Status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-updates:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        token: ${{ secrets.PAT }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: |
        bun install

    - name: Run display status
      env:
        STATUS_WEBHOOK_URL: ${{ secrets.STATUS_WEBHOOK_URL }}
      run: bun run scripts/display_status.ts

    - name: Commit and push changes
      env:
        GIT_TOKEN: ${{ secrets.PAT }}
      run: |
        git config --local user.email "bemimnitran@gmail.com"
        git config --local user.name "Hà Tiến Sáng"
        git add novel_status.md
        if [ -f message_id.txt ]; then git add message_id.txt; fi
        git commit -m "Update novel tracking data" || echo "No changes to commit"
        git push
